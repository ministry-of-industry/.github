<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1828" />
      <stop offset="50%" stop-color="#0F2038" />
      <stop offset="100%" stop-color="#050C16" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="50%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4DB" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="340" fill="url(#grid)" />
  </g>

  <!-- Glowing Abstract Tech Circles -->
  <circle cx="1100" cy="60" r="180" fill="#00B4DB" opacity="0.05" filter="url(#glow)" />
  <circle cx="100" cy="280" r="140" fill="#F1C40F" opacity="0.04" filter="url(#glow)" />

  <!-- Top Pillar Decorative Line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#goldGrad)" rx="3" />

  <!-- Government Tag Badge -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#162B45" stroke="#F1C40F" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="14" r="5" fill="#F1C40F" />
    <text x="30" y="18" fill="#F1C40F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">GOVERNMENT OF SRI LANKA</text>
  </g>

  <!-- Main Ministry Title -->
  <text x="60" y="122" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">
    Ministry of Industry &amp; Entrepreneurship Development
  </text>

  <!-- Sinhala / Tamil / Subtitle Text -->
  <text x="60" y="156" fill="#00B4DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">
    Digital Transformation &amp; Open Source Software Engineering Portal
  </text>

  <text x="60" y="184" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Empowering Sri Lanka's Industrial Base through Innovation, Digital Infrastructure &amp; Sustainable Growth
  </text>

  <!-- Key Pillars Pills -->
  <g transform="translate(60, 225)">
    <!-- Pill 1: Industrial Development -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏭 Industrial Growth</text>
    </g>

    <!-- Pill 2: Entrepreneurship -->
    <g transform="translate(222, 0)">
      <rect width="220" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Entrepreneurship</text>
    </g>

    <!-- Pill 3: Innovation & Tech -->
    <g transform="translate(454, 0)">
      <rect width="210" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">💡 Innovation &amp; Tech</text>
    </g>

    <!-- Pill 4: Export & Market -->
    <g transform="translate(676, 0)">
      <rect width="200" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌍 Export Expansion</text>
    </g>

    <!-- Pill 5: Sustainable -->
    <g transform="translate(888, 0)">
      <rect width="190" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌱 Sustainability</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="334" width="1200" height="6" fill="url(#tealGrad)" rx="3" />
</svg>
